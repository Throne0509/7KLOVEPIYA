<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>47LOVEPIYA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: app bar, search + type chips, grid of enemy teams. Sheet views: enemy → counter teams grid → counter detail (hero cards with gear + stats); editors */
:root{
  --bg:#fbfafb; --surface:#ffffff; --ink:#1d1a1f; --muted:#7a7380; --line:#ebe6ec;
  --rose:#e2456b; --rose-soft:#fdeef2; --rose-line:#f6cfd9;
  --sky-soft:#eef4fd; --sky-line:#d3e2f8;
  --tank:#8a6a2c; --tank-bg:#fbf3e3; --magic:#2f6fc9; --magic-bg:#e8f1fd; --phys:#c9382f; --phys-bg:#fdeceb; --etc:#7a4fc1; --etc-bg:#f1ebfc; --none:#7a7380; --none-bg:#f1eff2;
  --badge:#26222a; --badge-ink:#ffffff;
  --display:"Bai Jamjuree","Noto Sans Thai",system-ui,sans-serif;
  --body:"Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141216; --surface:#1d1a20; --ink:#f1edf3; --muted:#a39aa8; --line:#2e2a33;
  --rose:#ff6e8f; --rose-soft:#2c1a21; --rose-line:#4a2632; --sky-soft:#17202d; --sky-line:#26364d;
  --tank:#e3c27f; --tank-bg:#2c2416; --magic:#7fb0f5; --magic-bg:#16233a; --phys:#f48b84; --phys-bg:#331a19; --etc:#b896f2; --etc-bg:#251c36; --none:#a39aa8; --none-bg:#26222a;
  --badge:#f1edf3; --badge-ink:#141216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141216; --surface:#1d1a20; --ink:#f1edf3; --muted:#a39aa8; --line:#2e2a33;
  --rose:#ff6e8f; --rose-soft:#2c1a21; --rose-line:#4a2632; --sky-soft:#17202d; --sky-line:#26364d;
  --tank:#e3c27f; --tank-bg:#2c2416; --magic:#7fb0f5; --magic-bg:#16233a; --phys:#f48b84; --phys-bg:#331a19; --etc:#b896f2; --etc-bg:#251c36; --none:#a39aa8; --none-bg:#26222a;
  --badge:#f1edf3; --badge-ink:#141216; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
[hidden]{display:none!important}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px}
.bar{display:flex;align-items:center;gap:10px;padding-block:12px}
.bar h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:.02em}
.bar small{color:var(--muted);font-size:12px;flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:600;font-size:13px}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--surface)}
.btn.danger{color:var(--phys);border-color:var(--phys-bg)}
.btn:disabled{opacity:.5;cursor:default}
main{padding-block:20px 48px}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.search input{border:0;background:none;flex:1;min-width:0;font:inherit;color:var(--ink);outline:none}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-block:14px 18px}
.filters .lbl{color:var(--muted);font-size:12px;margin-right:4px}
.filters .count{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.t-ถึก{color:var(--tank);border-color:currentColor}.chip.t-เวทย์{color:var(--magic);border-color:currentColor}
.chip.t-กายภาพ{color:var(--phys);border-color:currentColor}.chip.t-อื่นๆ{color:var(--etc);border-color:currentColor}
.chip.t-ถึก[aria-pressed="true"]{background:var(--tank);color:var(--surface)}.chip.t-เวทย์[aria-pressed="true"]{background:var(--magic);color:var(--surface)}
.chip.t-กายภาพ[aria-pressed="true"]{background:var(--phys);color:var(--surface)}.chip.t-อื่นๆ[aria-pressed="true"]{background:var(--etc);color:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{background:var(--rose-soft);color:var(--rose);font-size:11px;font-weight:600;border-radius:999px;padding:2px 10px}
.tag.form{background:var(--none-bg);color:var(--ink)}
.card-top .n{font-size:12px;color:var(--muted)}
/* formation board */
.formation{display:grid;grid-template-columns:1fr auto;background:var(--rose-soft);border:1px solid var(--rose-line);border-radius:10px}
.formation.ally{background:var(--sky-soft);border-color:var(--sky-line)}
.formation.ally .petcol{border-left-color:var(--sky-line)}
.rows{display:flex;flex-direction:column;justify-content:center;gap:10px;padding:12px 26px 12px 8px;min-width:0}
.row{display:flex;align-items:flex-start;justify-content:center;gap:14px;position:relative;min-height:20px;flex-wrap:wrap}
.row .pos{position:absolute;right:-22px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--surface);border:1.5px solid var(--rose);color:var(--rose)}
.row.front .pos{border-color:var(--magic);color:var(--magic)}
.petcol{border-left:1px solid var(--rose-line);padding:12px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.hero{display:flex;flex-direction:column;align-items:center;gap:3px;width:64px}
.pwrap{position:relative}
.portrait{width:58px;height:58px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-size:20px;font-weight:700;position:relative;overflow:hidden;border:2px solid currentColor}
.portrait .ty{position:absolute;left:2px;top:2px;font-size:9px;line-height:1;padding:2px 3px;border-radius:3px;background:currentColor}
.portrait .ty span{color:var(--surface)}
.ty-ถึก{color:var(--tank);background:var(--tank-bg)}.ty-เวทย์{color:var(--magic);background:var(--magic-bg)}
.ty-กายภาพ{color:var(--phys);background:var(--phys-bg)}.ty-สนับสนุน{color:var(--etc);background:var(--etc-bg)}
.ty-none{color:var(--none);background:var(--none-bg)}
.hero .nm{font-size:12px;text-align:center;line-height:1.2;word-break:break-word}
.slot{width:58px;height:58px;border-radius:8px;border:1.5px dashed var(--line)}
.orders{position:absolute;right:-11px;top:-4px;display:flex;flex-direction:column;gap:2px}
.ob{width:18px;height:18px;border-radius:50%;background:var(--badge);color:var(--badge-ink);font-size:10px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pet .portrait{border-radius:50%;color:var(--rose);background:var(--surface)}
.subpet .portrait{width:30px;height:30px;font-size:12px;border-width:1.5px}
.subpet{width:40px}.subpet .nm{font-size:10px;color:var(--muted)}
.card-foot{border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-foot .note{color:var(--muted);font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;flex:1;min-width:0}
.more{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 0;white-space:nowrap;margin-left:auto}
.more:hover{color:var(--rose)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:48px 16px;line-height:1.7}
/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.panel{background:var(--bg);border-radius:16px;width:100%;max-width:640px;padding:18px;display:flex;flex-direction:column;gap:14px}
.panel.wide{max-width:900px}
.panel-head{display:flex;align-items:center;gap:8px}
.panel-head h2{font-family:var(--display);font-size:17px;margin:0;text-wrap:balance;flex:1}
.x,.backbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;flex:none}
.x{width:32px}.backbtn{padding:0 10px;font-size:13px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 -2px}
.sec h3{font-size:14px;margin:0;font-family:var(--display)}
.sec small{color:var(--muted);font-weight:400;font-family:var(--body)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.advice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.advice b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.advice p{margin:0;line-height:1.65;white-space:pre-wrap}
/* hero detail cards */
.hcards{display:grid;gap:12px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px}
.hcard .who{display:flex;flex-direction:column;align-items:center;gap:6px;width:76px}
.hcard .who .nm{font-weight:600;font-size:13px;text-align:center}
.hcard .who .tyl{font-size:11px}
.hbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.gear{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.glabel{font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.pills{display:flex;flex-wrap:wrap;gap:4px}
.pill{background:var(--none-bg);border-radius:6px;padding:3px 8px;font-size:12px}
.pill.ring{background:var(--tank-bg);color:var(--tank)}
.pill.set{background:var(--etc-bg);color:var(--etc)}
.pill.ord{background:var(--badge);color:var(--badge-ink);font-variant-numeric:tabular-nums}
.dash{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);margin:0 -1px -1px 0}
.stat span{color:var(--muted)}
.stat b{font-variant-numeric:tabular-nums;font-weight:600}
.hdetail{margin:0;line-height:1.6;white-space:pre-wrap}
/* editor */
.fset{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field span{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:56px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sgrid .field input{padding:6px 8px;font-variant-numeric:tabular-nums}
details.hed{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.hed summary{padding:10px 12px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
details.hed summary small{color:var(--muted);font-weight:400}
details.hed .inner{padding:0 12px 12px;display:grid;gap:10px}
.hint{font-size:12px;color:var(--muted);margin:0}
.err{color:var(--phys);font-size:13px;margin:0}
.fset-head b{font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:20}
@media (max-width:480px){
  .hero{width:56px}.portrait,.slot{width:50px;height:50px;font-size:17px}.row{gap:10px}
  .bar small{display:none}.bar h1{flex:1}
  .hcard{grid-template-columns:1fr}.hcard .who{flex-direction:row;width:auto}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--rose-line)}}
</style>
</head>
<body>
<header><div class="wrap bar"><h1>47LOVEPIYA</h1><small>ฐานข้อมูลทีมแก้</small><button class="btn" id="login">แอดมิน</button><button class="btn primary" id="add" hidden>+ เพิ่มทีม</button></div></header>
<main class="wrap">
  <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ค้นหาทีมศัตรู... เช่น ยูนอน อีวูอี" aria-label="ค้นหาตัวละคร"></label>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"><p class="empty">กำลังโหลดทีม...</p></div>
</main>
<datalist id="heroList"></datalist>
<datalist id="petList"></datalist>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
// Known heroes set the color of a tile. A name not listed here still works and shows grey.
const HEROES = {
  "ยูนอน":"กายภาพ","โดยอง":"กายภาพ","อีวูอี":"สนับสนุน","ยอนฮี":"เวทย์","ไอลีน":"ถึก","อาริส":"สนับสนุน",
  "แร็ดคริด":"ถึก","โอบิก":"เวทย์","ซอริน":"กายภาพ","เดลโลนส์":"กายภาพ","สกัส":"เวทย์","รูดี้":"ถึก",
  "เรเชล":"เวทย์","คริส":"กายภาพ","เอซ":"สนับสนุน"
};
const PETS = ["ปุยหิมะ","แมวทอง","นกเพลิง","อีกาดำ"];
const TEAM_TYPES = ["ถึก","เวทย์","กายภาพ","อื่นๆ"];
// Must match FORMATIONS in lib/team.js
const FORMATIONS = {"หน้า 1 หลัง 4":{F:1,B:4},"หน้า 2 หลัง 3":{F:2,B:3},"หน้า 3 หลัง 2":{F:3,B:2},"หน้า 4 หลัง 1":{F:4,B:1}};
// Must match STAT_KEYS in lib/team.js. [key, label, unit]
const STATS = [
  ["atk","พลังโจมตี",""],["def","ป้องกัน",""],["hp","HP",""],["spd","สปีด",""],
  ["crit","อัตราคริ","%"],["critDmg","ดาเมจคริ","%"],["weak","โอกาสโดนจุดอ่อน","%"],["block","อัตราบล็อก","%"],
  ["hit","เข้าเป้า","%"],["res","ต้านทาน","%"],["dtr","ลดดาเมจที่ได้รับ","%"],["amp","เพิ่มดาเมจ","%"],
  ["crush","บดขยี้","%"],["resil","ความทนทาน","%"],["rejuv","ฟื้นฟู","%"]
];

const state = {q:"", type:"ทั้งหมด", teams:null, canWrite:false, password:null};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const members = t => [...t.back, ...t.front];
const splitList = s => s.split(/[,，]/).map(x => x.trim()).filter(Boolean);
const teamById = id => { const t = state.teams.find(x => x.id === id); if(!t) throw new Error("ไม่พบทีม " + id); return t; };

function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

// ---------- rendering pieces
function heroHTML(name, order){
  const ty = HEROES[name];
  const badge = ty ? `<span class="ty"><span>${ty[0]}</span></span>` : "";
  const ob = order && order.length ? `<span class="orders">${order.map(n => `<span class="ob">${n}</span>`).join("")}</span>` : "";
  return `<div class="hero"><div class="pwrap"><div class="portrait ${ty ? "ty-" + ty : "ty-none"}">${badge}${esc([...name][0])}</div>${ob}</div><span class="nm">${esc(name)}</span></div>`;
}
const petHTML = (name, cls = "pet") => `<div class="hero ${cls}"><div class="portrait">${esc([...name][0])}</div><span class="nm">${esc(name)}</span></div>`;
function rowHTML(names, slots, cls, label, heroes){
  const empties = slots === undefined ? 0 : Math.max(0, slots - names.length);
  return `<div class="row ${cls}">${names.map(n => heroHTML(n, heroes?.[n]?.order)).join("")}${'<div class="hero"><div class="slot"></div></div>'.repeat(empties)}<span class="pos" title="${label}">${cls === "back" ? "B" : "F"}</span></div>`;
}
// t: {back, front, pet, subPet?, formation?, heroes?}
function formationHTML(t, ally = false){
  const slots = FORMATIONS[t.formation];
  return `<div class="formation${ally ? " ally" : ""}"><div class="rows">
    ${rowHTML(t.back, slots?.B, "back", "แถวหลัง", t.heroes)}
    ${rowHTML(t.front, slots?.F, "front", "แถวหน้า", t.heroes)}
  </div><div class="petcol">${t.pet ? petHTML(t.pet) : ""}${t.subPet ? petHTML(t.subPet, "subpet") : ""}</div></div>`;
}
function matches(t){
  if(state.type !== "ทั้งหมด" && t.type !== state.type) return false;
  const q = state.q.trim();
  return !q || [...members(t), ...t.counters.flatMap(members)].some(n => n.includes(q));
}
function renderFilters(){
  $("#filters").innerHTML = `<span class="lbl">ประเภททีม</span>` + ["ทั้งหมด", ...TEAM_TYPES].map(ty =>
    `<button class="chip${ty === "ทั้งหมด" ? "" : " t-" + ty}" data-type="${ty}" aria-pressed="${state.type === ty}">${ty}</button>`).join("")
    + `<span class="count">ทั้งหมด ${state.teams ? state.teams.filter(matches).length : 0} รายการ</span>`;
}
function render(){
  renderFilters();
  if(state.teams === null) return;
  const grid = $("#grid");
  if(!state.teams.length){
    grid.innerHTML = `<p class="empty">ยังไม่มีทีม${state.canWrite ? "<br>กด “+ เพิ่มทีม” ด้านบนเพื่อเพิ่มทีมแรก" : ""}</p>`;
    return;
  }
  const list = state.teams.filter(matches);
  grid.innerHTML = list.length ? list.map(t => `
    <article class="card">
      <div class="card-top"><span class="tag">ทีมที่ต้องการตี</span><span class="n">${t.counters.length} ทีมแก้</span></div>
      ${formationHTML(t)}
      <div class="card-foot"><button class="more" data-open-enemy="${esc(t.id)}">ดูเพิ่ม ›</button></div>
    </article>`).join("") : `<p class="empty">ไม่พบทีมที่ตรงกับ “${esc(state.q)}”</p>`;
}

// ---------- view: enemy team + its counters
function openEnemy(id){
  const t = teamById(id);
  showPanel(`<div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="ph">
    <div class="panel-head"><h2 id="ph">ทีมที่ต้องการตี · ${esc(t.type)}</h2><button class="x" data-close aria-label="ปิด">✕</button></div>
    ${formationHTML(t)}
    ${state.canWrite ? `<div class="actions"><button class="btn" data-edit-enemy="${esc(t.id)}">แก้ไขทีมศัตรู</button></div>` : ""}
    <div class="sec"><h3>ทีมที่ใช้ต่อสู้ได้ <small>${t.counters.length} ทีม</small></h3>
      ${state.canWrite ? `<button class="btn primary" data-add-counter="${esc(t.id)}">+ เพิ่มทีมสู้</button>` : ""}</div>
    ${t.counters.length ? `<div class="grid">${t.counters.map((c, i) => `
      <article class="card">
        <div class="card-top"><span class="tag form">${esc(c.formation || "ทีมสู้ " + (i + 1))}</span></div>
        ${formationHTML(c, true)}
        <div class="card-foot">${c.note ? `<span class="note">${esc(c.note)}</span>` : ""}<button class="more" data-open-counter="${esc(t.id)}" data-i="${i}">ดูรายละเอียด ›</button></div>
      </article>`).join("")}</div>`
    : `<p class="empty">ยังไม่มีทีมสู้${state.canWrite ? " กด “+ เพิ่มทีมสู้” เพื่อเพิ่ม" : ""}</p>`}
  </div>`);
}

// ---------- view: one counter team in full
function statsHTML(stats){
  const filled = STATS.filter(([k]) => stats[k] !== undefined);
  if(!filled.length) return "";
  return `<div><div class="glabel">สเตตัส</div><div class="stats">${filled.map(([k, label, unit]) =>
    `<div class="stat"><span>${label}</span><b>${stats[k].toLocaleString("th-TH")}${unit}</b></div>`).join("")}</div></div>`;
}
function pills(list, cls){ return list.length ? `<div class="pills">${list.map(x => `<span class="pill ${cls}">${esc(x)}</span>`).join("")}</div>` : `<span class="dash">—</span>`; }
function heroCardHTML(name, d){
  const ty = HEROES[name];
  return `<div class="hcard">
    <div class="who">${heroHTML(name)}${ty ? `<span class="tyl ty-${ty}" style="background:none">${ty}</span>` : ""}</div>
    <div class="hbody">
      <div class="gear">
        <div><div class="glabel">ลำดับกดสกิล</div>${d.order.length ? `<div class="pills">${d.order.map(n => `<span class="pill ord">${n}</span>`).join("")}</div>` : `<span class="dash">—</span>`}</div>
        <div><div class="glabel">แหวน</div>${pills(d.rings, "ring")}</div>
        <div><div class="glabel">เซ็ตไอเทม</div>${pills(d.sets, "set")}</div>
      </div>
      ${statsHTML(d.stats)}
      ${d.detail ? `<p class="hdetail">${esc(d.detail)}</p>` : ""}
    </div>
  </div>`;
}
function openCounter(id, i){
  const t = teamById(id), c = t.counters[i];
  const withDetail = members(c).filter(n => c.heroes[n]);
  showPanel(`<div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="ph">
    <div class="panel-head"><button class="backbtn" data-open-enemy="${esc(id)}">‹ กลับ</button><h2 id="ph">รายละเอียดทีมสู้${c.formation ? " · " + esc(c.formation) : ""}</h2><button class="x" data-close aria-label="ปิด">✕</button></div>
    <p class="hint">สู้กับ ${esc(members(t).join(" · "))}</p>
    ${formationHTML(c, true)}
    ${c.note ? `<div class="advice"><b>คำแนะนำ / วิธีเล่น</b><p>${esc(c.note)}</p></div>` : ""}
    <div class="sec"><h3>ตัวละคร</h3></div>
    ${withDetail.length ? `<div class="hcards">${withDetail.map(n => heroCardHTML(n, c.heroes[n])).join("")}</div>`
      : `<p class="empty">ยังไม่มีรายละเอียดตัวละคร${state.canWrite ? " กด “แก้ไขทีมสู้” เพื่อเพิ่ม" : ""}</p>`}
    ${state.canWrite ? `<p class="err" id="formErr" hidden></p><div class="actions">
      <button class="btn danger" data-del-counter="${esc(id)}" data-i="${i}">ลบทีมสู้</button>
      <button class="btn primary" data-edit-counter="${esc(id)}" data-i="${i}">แก้ไขทีมสู้</button></div>` : ""}
  </div>`);
}

// ---------- editor: enemy team (formation only; counters are edited one by one)
function namesFields(prefix, f){
  return `<div class="fgrid">
    <label class="field"><span>แถวหลัง (B)</span><input id="${prefix}-back" list="heroList" value="${esc(f.back.join(", "))}" placeholder="ยูนอน, โดยอง" data-names></label>
    <label class="field"><span>แถวหน้า (F)</span><input id="${prefix}-front" list="heroList" value="${esc(f.front.join(", "))}" placeholder="อีวูอี" data-names></label>
    <label class="field"><span>สัตว์เลี้ยง</span><input id="${prefix}-pet" list="petList" value="${esc(f.pet)}" placeholder="ปุยหิมะ"></label>
  </div>`;
}
function openEnemyEditor(id){
  const t = id ? teamById(id) : {type:"กายภาพ", back:[], front:[], pet:"", counters:[]};
  showPanel(`<form class="panel" id="enemyForm" data-id="${id ? esc(id) : ""}" role="dialog" aria-modal="true" aria-labelledby="ph">
    <div class="panel-head">${id ? `<button type="button" class="backbtn" data-open-enemy="${esc(id)}">‹ กลับ</button>` : ""}<h2 id="ph">${id ? "แก้ไขทีมศัตรู" : "เพิ่มทีมที่ต้องการตี"}</h2><button type="button" class="x" data-close aria-label="ปิด">✕</button></div>
    <p class="hint">ใส่ชื่อตัวละครคั่นด้วยจุลภาค ( , ) แต่ละแถวไม่เกิน 4 ตัว รวมทั้งทีม 1–5 ตัว ทีมสู้เพิ่มได้หลังบันทึก</p>
    <div class="fset">
      <label class="field"><span>ประเภททีม</span><select id="e-type">${TEAM_TYPES.map(ty => `<option${ty === t.type ? " selected" : ""}>${ty}</option>`).join("")}</select></label>
      ${namesFields("e", t)}
    </div>
    <p class="err" id="formErr" hidden></p>
    <div class="actions">
      ${id ? `<button type="button" class="btn danger" id="delEnemy">ลบทีมนี้ทั้งหมด</button>` : ""}
      <button type="submit" class="btn primary" id="save">บันทึก</button>
    </div>
  </form>`);
}
function readNames(prefix, label){
  const f = {back: splitList($(`#${prefix}-back`).value), front: splitList($(`#${prefix}-front`).value), pet: $(`#${prefix}-pet`).value.trim()};
  const all = [...f.back, ...f.front];
  if(!all.length) throw new Error(`${label}: ต้องมีตัวละครอย่างน้อย 1 ตัว`);
  if(f.back.length > 4 || f.front.length > 4) throw new Error(`${label}: แต่ละแถวไม่เกิน 4 ตัว`);
  if(all.length > 5) throw new Error(`${label}: รวมทั้งทีมไม่เกิน 5 ตัว`);
  if(new Set(all).size !== all.length) throw new Error(`${label}: มีชื่อตัวละครซ้ำ`);
  return f;
}
async function saveEnemy(form){
  const id = form.dataset.id;
  const base = {type: $("#e-type").value, ...readNames("e", "ทีมที่ต้องการตี")};
  const team = id ? {...teamById(id), ...base} : {...base, counters: []};
  const saved = await api(id ? "PUT" : "POST", id ? teamUrl(id) : "/api/teams", strip(team));
  await loadTeams();
  toast("บันทึกแล้ว");
  openEnemy(id || saved.id);
}

// ---------- editor: one counter team with per-hero details
function heroFieldsHTML(name, d){
  return `<details class="hed" data-hero="${esc(name)}" open>
    <summary>${esc(name)} <small>${HEROES[name] || "ตัวละครใหม่"}</small></summary>
    <div class="inner">
      <div class="fgrid">
        <label class="field"><span>ลำดับกดสกิล (เช่น 2, 3)</span><input data-f="order" value="${esc(d.order.join(", "))}" inputmode="numeric"></label>
        <label class="field"><span>แหวน (สูงสุด 3 คั่นด้วย , )</span><input data-f="rings" value="${esc(d.rings.join(", "))}" placeholder="แหวนอำนาจ, อมตะ"></label>
        <label class="field"><span>เซ็ตไอเทม (สูงสุด 3)</span><input data-f="sets" value="${esc(d.sets.join(", "))}"></label>
      </div>
      <div class="sgrid">${STATS.map(([key, label, unit]) =>
        `<label class="field"><span>${label}${unit ? " (" + unit + ")" : ""}</span><input data-s="${key}" type="number" min="0" step="any" value="${d.stats[key] ?? ""}"></label>`).join("")}</div>
      <label class="field"><span>รายละเอียด / คำแนะนำของตัวนี้</span><textarea data-f="detail" placeholder="เช่น คาว6+6 สปีดเกินซอรีน ต้าน100 เข้าเป้า30">${esc(d.detail)}</textarea></label>
    </div>
  </details>`;
}
const blankHero = () => ({order:[], rings:[], sets:[], stats:{}, detail:""});
function readHero(el){
  const name = el.dataset.hero, f = k => el.querySelector(`[data-f="${k}"]`).value;
  const order = splitList(f("order")).map(Number);
  if(order.some(n => !Number.isInteger(n) || n < 1 || n > 20)) throw new Error(`${name}: ลำดับสกิลต้องเป็นเลข 1–20`);
  const rings = splitList(f("rings")), sets = splitList(f("sets"));
  if(rings.length > 3 || sets.length > 3) throw new Error(`${name}: แหวนและเซ็ตไอเทมใส่ได้อย่างละไม่เกิน 3`);
  const stats = {};
  for(const input of el.querySelectorAll("[data-s]")) if(input.value !== "") stats[input.dataset.s] = Number(input.value);
  return [name, {order, rings, sets, stats, detail: f("detail").trim()}];
}
function readHeroes(){
  return Object.fromEntries([...$("#heroFields").querySelectorAll("[data-hero]")].map(readHero));
}
// One live section per hero name. Sections are kept as nodes (never re-rendered), so typed values survive
// renames and the field the user is moving into is never replaced. Called on every keystroke in the name fields.
function syncHeroFields(){
  const names = [...splitList($("#c-back").value), ...splitList($("#c-front").value)];
  const box = $("#heroFields");
  for(const el of box.querySelectorAll("[data-hero]")) state.heroNodes.set(el.dataset.hero, el);
  const hint = names.length ? null : Object.assign(document.createElement("p"), {className: "hint", textContent: "ใส่ชื่อตัวละครด้านบนก่อน ช่องรายละเอียดจะขึ้นที่นี่"});
  box.replaceChildren(...(hint ? [hint] : [...new Set(names)].map(n => {
    if(!state.heroNodes.has(n)){
      const tpl = document.createElement("template");
      tpl.innerHTML = heroFieldsHTML(n, state.editHeroes[n] || blankHero());
      state.heroNodes.set(n, tpl.content.firstElementChild);
    }
    return state.heroNodes.get(n);
  })));
}
function openCounterEditor(id, i){
  const t = teamById(id);
  const c = i === null ? {back:[], front:[], pet:"", subPet:"", formation:"", note:"", heroes:{}} : t.counters[i];
  state.editHeroes = c.heroes;
  state.heroNodes = new Map();
  showPanel(`<form class="panel wide" id="counterForm" data-id="${esc(id)}" data-i="${i === null ? "" : i}" role="dialog" aria-modal="true" aria-labelledby="ph">
    <div class="panel-head"><button type="button" class="backbtn" data-open-enemy="${esc(id)}">‹ กลับ</button><h2 id="ph">${i === null ? "เพิ่มทีมสู้" : "แก้ไขทีมสู้"}</h2><button type="button" class="x" data-close aria-label="ปิด">✕</button></div>
    <p class="hint">สู้กับ ${esc(members(t).join(" · "))}</p>
    <div class="fset">
      <div class="fgrid">
        <label class="field"><span>ฟอร์เมชัน</span><select id="c-formation"><option value="">ไม่ระบุ</option>${Object.keys(FORMATIONS).map(f => `<option${f === c.formation ? " selected" : ""}>${f}</option>`).join("")}</select></label>
        <label class="field"><span>สัตว์เลี้ยงรอง</span><input id="c-subPet" list="petList" value="${esc(c.subPet)}"></label>
      </div>
      ${namesFields("c", c)}
      <label class="field"><span>คำแนะนำ / วิธีเล่นของทีม</span><textarea id="c-note" placeholder="เช่น เปิดก่อน">${esc(c.note)}</textarea></label>
    </div>
    <div class="sec"><h3>รายละเอียดตัวละคร <small>เว้นว่างช่องที่ไม่รู้ได้</small></h3></div>
    <div id="heroFields" class="hcards"></div>
    <p class="err" id="formErr" hidden></p>
    <div class="actions"><button type="submit" class="btn primary" id="save">บันทึกทีมสู้</button></div>
  </form>`);
  syncHeroFields();
}
async function saveCounter(form){
  const t = teamById(form.dataset.id);
  const i = form.dataset.i === "" ? null : Number(form.dataset.i);
  const f = readNames("c", "ทีมสู้");
  const formation = $("#c-formation").value;
  const slots = FORMATIONS[formation];
  if(slots && (f.front.length > slots.F || f.back.length > slots.B))
    throw new Error(`${formation} วางแถวหน้าได้ ${slots.F} ตัว แถวหลัง ${slots.B} ตัว`);
  const heroes = readHeroes();
  const counter = {...f, formation, subPet: $("#c-subPet").value.trim(), note: $("#c-note").value.trim(), heroes};
  const counters = [...t.counters];
  if(i === null) counters.push(counter); else counters[i] = counter;
  await api("PUT", teamUrl(t.id), strip({...t, counters}));
  await loadTeams();
  toast("บันทึกทีมสู้แล้ว");
  openCounter(t.id, i === null ? counters.length - 1 : i);
}

// ---------- deletes (two-tap confirm, no browser dialogs)
function confirmTap(btn, label){
  if(btn.dataset.confirm === "1") return true;
  btn.dataset.confirm = "1"; btn.textContent = label;
  return false;
}
async function deleteCounter(id, i, btn){
  if(!confirmTap(btn, "กดอีกครั้งเพื่อยืนยันการลบ")) return;
  const t = teamById(id);
  await api("PUT", teamUrl(id), strip({...t, counters: t.counters.filter((_, k) => k !== i)}));
  await loadTeams(); toast("ลบทีมสู้แล้ว"); openEnemy(id);
}
async function deleteEnemy(id, btn){
  if(!confirmTap(btn, "กดอีกครั้ง: ลบทีมนี้และทีมสู้ทั้งหมด")) return;
  await api("DELETE", teamUrl(id));
  await loadTeams(); closeSheet(); toast("ลบทีมแล้ว");
}

// ---------- api
const teamUrl = id => "/api/teams/" + encodeURIComponent(id);
const strip = ({id, createdAt, updatedAt, ...team}) => team;
async function api(method, path, body){
  const headers = {"content-type":"application/json"};
  if(state.password) headers.authorization = "Bearer " + state.password;
  const res = await fetch(path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  if(res.status === 401) setAdmin(null);
  if(!res.ok) throw new Error(data.error || `เซิร์ฟเวอร์ตอบกลับผิดพลาด (${res.status}) ลองใหม่อีกครั้ง`);
  return data;
}
async function loadTeams(){
  try { state.teams = await api("GET", "/api/teams"); render(); }
  catch(e){ $("#grid").innerHTML = `<p class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}</p>`; }
}

// ---------- admin
const PW_KEY = "47lovepiya-admin";
function setAdmin(pw){
  state.password = pw; state.canWrite = !!pw;
  $("#add").hidden = !pw;
  $("#login").textContent = pw ? "ออกจากระบบ" : "แอดมิน";
  try { pw ? sessionStorage.setItem(PW_KEY, pw) : sessionStorage.removeItem(PW_KEY); } catch {}
  render();
}
function openLogin(){
  showPanel(`<form class="panel" id="loginForm" role="dialog" aria-modal="true" aria-labelledby="ph" style="max-width:380px">
    <div class="panel-head"><h2 id="ph">เข้าสู่ระบบแอดมิน</h2><button type="button" class="x" data-close aria-label="ปิด">✕</button></div>
    <label class="field"><span>รหัสผ่าน</span><input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="formErr" hidden></p>
    <div class="actions"><button type="submit" class="btn primary" id="save">เข้าสู่ระบบ</button></div>
  </form>`);
  $("#pw").focus();
}
async function login(){
  state.password = $("#pw").value;
  try { await api("POST", "/api/auth"); }
  catch(e){ state.password = null; throw e; }
  setAdmin(state.password); closeSheet(); toast("เข้าสู่ระบบแล้ว");
}

// ---------- sheet
function showPanel(html){
  const s = $("#sheet");
  s.innerHTML = html; s.hidden = false; s.scrollTop = 0;
  s.querySelector("[data-close]").focus();
}
function closeSheet(){ $("#sheet").hidden = true; $("#sheet").innerHTML = ""; }
function showError(e){ const el = $("#formErr"); if(!el) throw e; el.textContent = e.message; el.hidden = false; }
// Runs an async action from a button or form; shows its error in the open panel.
async function run(btn, fn){
  if(btn) btn.disabled = true;
  try { await fn(); }
  catch(e){ showError(e); if(btn && btn.isConnected) btn.disabled = false; }
}

// ---------- events
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#filters").addEventListener("click", e => { const b = e.target.closest("[data-type]"); if(b){ state.type = b.dataset.type; render(); } });
$("#grid").addEventListener("click", e => { const b = e.target.closest("[data-open-enemy]"); if(b) openEnemy(b.dataset.openEnemy); });
$("#add").addEventListener("click", () => openEnemyEditor(null));
$("#login").addEventListener("click", () => state.password ? setAdmin(null) : openLogin());
$("#sheet").addEventListener("click", e => {
  const t = e.target;
  if(t.id === "sheet" || t.closest("[data-close]")) return closeSheet();
  const b = t.closest("button");
  if(!b) return;
  const d = b.dataset, i = d.i === undefined ? null : Number(d.i);
  if(d.openEnemy) return openEnemy(d.openEnemy);
  if(d.openCounter) return openCounter(d.openCounter, i);
  if(d.editEnemy) return openEnemyEditor(d.editEnemy);
  if(d.addCounter) return openCounterEditor(d.addCounter, null);
  if(d.editCounter) return openCounterEditor(d.editCounter, i);
  if(d.delCounter) return run(b.dataset.confirm === "1" ? b : null, () => deleteCounter(d.delCounter, i, b));
  if(b.id === "delEnemy") return run(b.dataset.confirm === "1" ? b : null, () => deleteEnemy($("#enemyForm").dataset.id, b));
});
$("#sheet").addEventListener("input", e => { if(e.target.matches("#counterForm [data-names]")) syncHeroFields(); });
$("#sheet").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, btn = $("#save");
  const action = {loginForm: login, enemyForm: () => saveEnemy(f), counterForm: () => saveCounter(f)}[f.id];
  if(!action) throw new Error("ไม่รู้จักฟอร์ม " + f.id);
  run(btn, action);
});
document.addEventListener("keydown", e => { if(e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

$("#heroList").innerHTML = Object.keys(HEROES).map(n => `<option value="${esc(n)}">`).join("");
$("#petList").innerHTML = PETS.map(n => `<option value="${esc(n)}">`).join("");
let savedPw = null;
try { savedPw = sessionStorage.getItem(PW_KEY); } catch {}
setAdmin(savedPw);
loadTeams();
</script>
</body>
</html>
