<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>47LOVEPIYA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:wght@600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: app bar, search + type chips, grid of target teams. Board = formation rows of fixed slots (dashed when empty) + pet column.
   Sheets: target → counter grid → counter detail; editors use the same board with clickable slots and a character picker. */
:root{
  --bg:#fbfafb; --surface:#ffffff; --ink:#1d1a1f; --muted:#7a7380; --line:#ebe6ec; --dash:#e3d6dc;
  --rose:#e2456b; --rose-soft:#fff3f6; --rose-line:#f8dbe3; --rose-rail:#f7c4d1;
  --sky:#5b8fe0; --sky-soft:#f2f7fe; --sky-line:#dce8f9; --sky-rail:#c6dbf7;
  --tank:#8a6a2c; --tank-bg:#fbf3e3; --magic:#2f6fc9; --magic-bg:#e8f1fd; --phys:#c9382f; --phys-bg:#fdeceb; --etc:#7a4fc1; --etc-bg:#f1ebfc; --bal:#2c8a6a; --bal-bg:#e4f5ee; --none:#7a7380; --none-bg:#f1eff2;
  --badge:#26222a; --badge-ink:#ffffff;
  --display:"Bai Jamjuree","Noto Sans Thai",system-ui,sans-serif;
  --body:"Noto Sans Thai",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141216; --surface:#1d1a20; --ink:#f1edf3; --muted:#a39aa8; --line:#2e2a33; --dash:#45343c;
  --rose:#ff6e8f; --rose-soft:#24171c; --rose-line:#3d2530; --rose-rail:#5a2d3b;
  --sky:#7fb0f5; --sky-soft:#151d29; --sky-line:#243246; --sky-rail:#2e4566;
  --tank:#e3c27f; --tank-bg:#2c2416; --magic:#7fb0f5; --magic-bg:#16233a; --phys:#f48b84; --phys-bg:#331a19; --etc:#b896f2; --etc-bg:#251c36; --bal:#6fd3ad; --bal-bg:#16302a; --none:#a39aa8; --none-bg:#26222a;
  --badge:#f1edf3; --badge-ink:#141216; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141216; --surface:#1d1a20; --ink:#f1edf3; --muted:#a39aa8; --line:#2e2a33; --dash:#45343c;
  --rose:#ff6e8f; --rose-soft:#24171c; --rose-line:#3d2530; --rose-rail:#5a2d3b;
  --sky:#7fb0f5; --sky-soft:#151d29; --sky-line:#243246; --sky-rail:#2e4566;
  --tank:#e3c27f; --tank-bg:#2c2416; --magic:#7fb0f5; --magic-bg:#16233a; --phys:#f48b84; --phys-bg:#331a19; --etc:#b896f2; --etc-bg:#251c36; --bal:#6fd3ad; --bal-bg:#16302a; --none:#a39aa8; --none-bg:#26222a;
  --badge:#f1edf3; --badge-ink:#141216; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px}
[hidden]{display:none!important}
:root{padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px}
.bar{display:flex;align-items:center;gap:8px;padding-block:12px;flex-wrap:wrap}
.bar h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:.02em}
.bar small{color:var(--muted);font-size:12px;flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-weight:600;font-size:13px}
.btn.primary{background:var(--rose);border-color:var(--rose);color:var(--surface)}
.btn.danger{color:var(--phys);border-color:var(--phys-bg)}
.btn:disabled{opacity:.5;cursor:default}
main{padding-block:20px 48px}
.navtabs{display:flex;gap:4px}
.navtabs button{border:0;background:none;padding:8px 14px 10px;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent}
.navtabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--rose)}
/* speed order badge on a hero tile */
.tile .spd{position:absolute;left:-5px;top:-5px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--badge);color:var(--badge-ink);font-size:11px;font-weight:700;display:grid;place-items:center;z-index:2;font-variant-numeric:tabular-nums}
.tile.small .spd{min-width:15px;height:15px;font-size:9px;left:-4px;top:-4px}
/* skill icons (boss loops) */
.skill{--s:40px;width:var(--s);height:var(--s);border-radius:8px;position:relative;display:grid;place-items:center;overflow:hidden;border:1.5px solid var(--line);background:var(--surface);padding:0;font-family:var(--display);font-weight:700;font-size:14px;flex:none;color:var(--muted)}
.skill img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.skill.noimg{border-style:dashed}
.skill .sl{position:absolute;bottom:1px;left:0;right:0;font-size:9px;font-weight:600;font-family:var(--body);text-align:center;line-height:1.2}
.skill .step{position:absolute;left:1px;top:1px;background:var(--badge);color:var(--badge-ink);font-size:10px;line-height:14px;border-radius:4px;padding:0 4px;font-family:var(--body);z-index:1;font-variant-numeric:tabular-nums}
button.skill{cursor:pointer}button.skill:hover{border-color:var(--rose)}
.loop{display:flex;flex-wrap:wrap;gap:6px}
.lpal{display:flex;flex-wrap:wrap;gap:14px}
.lp{display:grid;grid-template-columns:repeat(3,auto);gap:4px;justify-items:center}
.lp .nm{grid-column:1 / -1;font-size:11px}
.skillup{display:flex;gap:12px;flex-wrap:wrap}
.su{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-size:12px;color:var(--muted)}
.su .skill{--s:52px}.su b{font-weight:600;color:var(--ink)}
.su input{font-size:12px;max-width:150px}
/* boss cards and detail */
.bhead{display:flex;gap:12px;align-items:center;min-width:0}
.bhead .bt{min-width:0}
.bhead h3{margin:0;font-family:var(--display);font-size:16px}
.bhead .note{color:var(--muted);font-size:12px;margin:2px 0 0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bface{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--rose-soft);border:1px solid var(--rose-line);display:grid;place-items:center;font-family:var(--display);font-size:24px;color:var(--rose);flex:none;position:relative}
.bface img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bhead.big{align-items:stretch;flex-wrap:wrap}.bhead.big .bface{width:96px;height:96px}.bhead.big .advice{flex:1;min-width:220px}
.mini{display:flex;flex-direction:column;gap:6px}
.mini .lbl{font-size:11px;color:var(--muted)}
.faces{display:flex;gap:6px;flex-wrap:wrap}
.room{display:grid;gap:12px;min-width:0}
.pop{z-index:15}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:10px 16px}
.search input{border:0;background:none;flex:1;min-width:0;font:inherit;color:var(--ink);outline:none}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-block:14px 18px}
.filters .lbl{color:var(--muted);font-size:12px;margin-right:4px}
.filters .count{margin-left:auto;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.t-ถึก{color:var(--tank);border-color:currentColor}.chip.t-เวทย์{color:var(--magic);border-color:currentColor}
.chip.t-กายภาพ{color:var(--phys);border-color:currentColor}.chip.t-อื่นๆ{color:var(--etc);border-color:currentColor}
.chip.t-ถึก[aria-pressed="true"]{background:var(--tank);color:var(--surface)}.chip.t-เวทย์[aria-pressed="true"]{background:var(--magic);color:var(--surface)}
.chip.t-กายภาพ[aria-pressed="true"]{background:var(--phys);color:var(--surface)}.chip.t-อื่นๆ[aria-pressed="true"]{background:var(--etc);color:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{background:var(--rose-soft);color:var(--rose);font-size:11px;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--rose-line)}
.tag.form{background:var(--none-bg);color:var(--ink);border-color:transparent}
.card-top .n{font-size:12px;color:var(--muted)}
.card-foot{border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card-foot .note{color:var(--muted);font-size:12px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;flex:1;min-width:0}
.more{border:0;background:none;color:var(--muted);font-size:12px;padding:4px 0;white-space:nowrap;margin-left:auto}
.more:hover{color:var(--rose)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 16px;line-height:1.7;margin:0}
/* board */
.board{display:grid;grid-template-columns:1fr auto;background:var(--rose-soft);border:1px solid var(--rose-line);border-radius:12px;min-width:0}
.board.ally{background:var(--sky-soft);border-color:var(--sky-line)}
.rows{display:flex;flex-direction:column;justify-content:center;gap:8px;padding:14px 10px;min-width:0;container-type:inline-size}
/* Slot size --t follows the row's real width. Per slot the row spends: face --t, +4px tile padding, + --sk skill column
   (box --b + 3px gap, counter boards only); plus gaps between slots and 30px for the B/F badge. Capped at 60px. */
.row{--gap:6px;--b:clamp(13px,5cqi,19px);
  --t:clamp(16px,calc((100cqi - 30px - (var(--n) - 1) * var(--gap)) / var(--n) - 4px - var(--sk,0px)),60px);
  display:flex;align-items:flex-start;justify-content:center;gap:var(--gap);position:relative;padding-right:30px}
.row::before{content:"";position:absolute;left:0;right:20px;top:calc(var(--t) * .535 - 2px);height:4px;border-radius:2px;background:linear-gradient(90deg,transparent,var(--rail) 45%)}
.row.B{--rail:var(--rose-rail)}.row.F{--rail:var(--sky-rail)}
.pos{position:absolute;right:0;top:calc(var(--t) * .535 - 12px);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--surface);border:2px solid var(--rail);color:var(--rail);z-index:1}
.row.B .pos{color:var(--rose)}.row.F .pos{color:var(--sky)}
.petcol{--t:52px;border-left:1px solid var(--rose-line);padding:10px 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.board.ally .petcol{border-left-color:var(--sky-line)}
:root{--t:60px}
.tile{display:flex;flex-direction:column;align-items:center;gap:3px;width:calc(var(--t) + 4px);position:relative;z-index:1;background:none;border:0;padding:0}
.face{width:var(--t);height:calc(var(--t) * 1.07);border-radius:7px;display:grid;place-items:center;font-family:var(--display);font-size:calc(var(--t) * .33);font-weight:700;position:relative;overflow:hidden;border:2px solid currentColor;background:var(--none-bg)}
.face img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ty-กายภาพ{color:var(--phys);background:var(--phys-bg)}.ty-เวทย์{color:var(--magic);background:var(--magic-bg)}
.ty-ถึก{color:var(--tank);background:var(--tank-bg)}.ty-สนับสนุน{color:var(--etc);background:var(--etc-bg)}
.ty-สมดุล{color:var(--bal);background:var(--bal-bg)}.ty-pet{color:var(--rose);background:var(--surface)}
.ty-ring{color:var(--tank);background:var(--tank-bg)}
.tile.ring,.tile.set{--t:46px}.tile.ring .face,.tile.ring .slot{height:var(--t);border-radius:50%}
.tile.set .face,.tile.set .slot{height:var(--t);border-radius:10px}.ty-set{color:var(--etc);background:var(--etc-bg)}
.rings,.ringrow{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap}
.plus{align-self:flex-start;height:46px;display:grid;place-items:center;font-weight:700;color:var(--muted);font-size:16px}
.ringpick{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
.preview.ring .face{border-radius:50%;width:84px;height:84px}.preview.set .face{border-radius:14px;width:84px;height:84px}
.tile .nm{font-size:clamp(9px,calc(var(--t) * .22),11px);text-align:center;line-height:1.2;word-break:break-word;color:var(--ink)}
.slot{width:var(--t);height:calc(var(--t) * 1.07);border-radius:7px;border:1.5px dashed var(--dash);background:color-mix(in srgb,var(--surface) 55%,transparent);display:grid;place-items:center;color:var(--muted);font-size:18px}
.tile.small{--t:34px}.tile.small .face,.tile.small .slot{border-width:1.5px}.tile.small .nm{font-size:10px;color:var(--muted)}
/* skill boxes: upper and lower skill of a hero, to the right of its face; the number is the cast order */
.board.skills .row{--sk:calc(var(--b) + 3px)}
.unit{display:flex;gap:3px;align-items:flex-start;position:relative;z-index:1}
.skb{display:flex;flex-direction:column;justify-content:space-between;height:max(calc(var(--t) * 1.07),calc(var(--b) * 2 + 2px));width:var(--b)}
.sk{width:var(--b);height:var(--b);border-radius:4px;border:1.5px solid var(--line);background:var(--surface);padding:0;display:grid;place-items:center;font-size:calc(var(--b) * .6);font-weight:700;color:var(--badge-ink);font-variant-numeric:tabular-nums}
.sk.on{background:var(--badge);border-color:var(--badge)}
button.sk{cursor:pointer}button.sk:hover{border-color:var(--rose)}
.skb.blank .sk{visibility:hidden}
/* editable board */
button.tile{cursor:pointer}
button.tile[aria-pressed="true"] .face,button.tile[aria-pressed="true"] .slot{outline:3px solid var(--rose);outline-offset:2px}
button.tile:hover .slot{border-color:var(--rose);color:var(--rose)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:10;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;justify-content:center;align-items:flex-start;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px}
.panel{background:var(--bg);border-radius:16px;width:100%;max-width:640px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel.wide{max-width:920px}
.panel-head{display:flex;align-items:center;gap:8px}
.panel-head h2{font-family:var(--display);font-size:17px;margin:0;text-wrap:balance;flex:1}
.x,.backbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:32px;flex:none}
.x{width:32px}.backbtn{padding:0 10px;font-size:13px}
.sec{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 -2px;flex-wrap:wrap}
.sec h3{font-size:14px;margin:0;font-family:var(--display)}
.sec small{color:var(--muted);font-weight:400;font-family:var(--body)}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.advice{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.advice b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.advice p{margin:0;line-height:1.65;white-space:pre-wrap}
.hint{font-size:12px;color:var(--muted);margin:0}
.err{color:var(--phys);font-size:13px;margin:0}
/* hero detail cards */
.hcards{display:grid;gap:12px}
.hcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px}
.hcard .who{display:flex;flex-direction:column;align-items:center;gap:4px;width:76px}
.hcard .who .tyl{font-size:11px;background:none}
.hbody{display:flex;flex-direction:column;gap:10px;min-width:0}
.gear{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.glabel{font-size:11px;color:var(--muted);margin-bottom:4px;letter-spacing:.02em}
.dash{color:var(--muted);font-size:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden}
.stat{display:flex;justify-content:space-between;gap:8px;padding:6px 10px;font-size:12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);margin:0 -1px -1px 0}
.stat span{color:var(--muted)}.stat b{font-variant-numeric:tabular-nums;font-weight:600}
.hdetail{margin:0;line-height:1.6;white-space:pre-wrap}
/* forms */
.fset{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:12px;min-width:0}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
.field textarea{resize:vertical;min-height:56px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 12px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picker{background:var(--bg);border:1px solid var(--rose-line);border-radius:12px;padding:12px;display:grid;gap:10px}
.picker-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.picker-head b{font-size:13px;flex:1;min-width:140px}
.picker-head input{flex:2;min-width:160px;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:10px;justify-items:center;max-height:280px;overflow-y:auto;padding:4px}
.pick-grid .tile[data-placed="true"] .face{opacity:.45}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sgrid .field input{padding:6px 8px;font-variant-numeric:tabular-nums}
details.hed{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details.hed summary{padding:10px 12px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:8px}
details.hed summary small{color:var(--muted);font-weight:400}
details.hed .inner{padding:0 12px 12px;display:grid;gap:10px}
/* character library */
.tabs{display:flex;gap:6px}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:12px;justify-items:center}
.preview{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.preview .face{width:84px;height:90px;font-size:28px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:20}
@media (max-width:480px){
  .petcol{--t:44px;padding:10px 6px}
  .bar small{display:none}.bar h1{flex:1}
  .hcard{grid-template-columns:1fr}.hcard .who{flex-direction:row;width:auto}
}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}.card:hover{border-color:var(--rose-line)}}
</style>
</head>
<body>
<header><div class="wrap bar"><h1>47LOVEPIYA</h1><small>ฐานข้อมูลทีมแก้</small>
  <button class="btn" id="library" hidden>คลังตัวละคร</button>
  <button class="btn" id="login">แอดมิน</button>
  <button class="btn primary" id="add" hidden>+ เพิ่มทีม</button></div>
  <nav class="wrap navtabs" aria-label="หมวด"><button data-tab="war" aria-pressed="true">กิลวอร์</button><button data-tab="boss" aria-pressed="false">ตีบอส</button><button data-tab="castle" aria-pressed="false">ปราสาท</button></nav></header>
<main class="wrap">
 <section id="warView">
  <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="ค้นหาทีมเป้าหมายจากชื่อตัวละคร" aria-label="ค้นหาตัวละคร"></label>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"><p class="empty">กำลังโหลด...</p></div>
 </section>
 <section id="bossView" hidden>
  <div class="grid" id="bossGrid"><p class="empty">กำลังโหลด...</p></div>
 </section>
</main>
<div class="sheet" id="sheet" hidden></div>
<div class="sheet pop" id="pop" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- constants (must match lib/team.js and lib/characters.js)
const TEAM_TYPES = ["ถึก","เวทย์","กายภาพ","อื่นๆ"];
const HERO_TYPES = ["กายภาพ","เวทย์","ถึก","สนับสนุน","สมดุล"];
const FORMATIONS = {"หน้า 4 หลัง 1":{F:4,B:1},"หน้า 3 หลัง 2":{F:3,B:2},"หน้า 2 หลัง 3":{F:2,B:3},"หน้า 1 หลัง 4":{F:1,B:4}};
const MAX_HEROES = 3;
const MAX_SKILLS = 3;
// must match lib/boss.js
const BOSS_ROOMS = 2, BOSS_MAX_HEROES = 5, MAX_LOOP = 40;
const ROOM_LABEL = ["ห้องแรก · ทีม 1", "ห้องสอง · ทีม 2"];
// Boss and castle guides share one data shape; `mode` says which tab lists them.
const MODE_LABEL = {boss: "บอส", castle: "ปราสาท"};
// must match SKILL_SLOTS in lib/characters.js
const SKILL_SLOTS = ["top", "bottom", "awake"];
const SKILL_LABEL = {top: "สกิลบน", bottom: "สกิลล่าง", awake: "สกิลอเวค"};
const SKILL_SHORT = {top: "บน", bottom: "ล่าง", awake: "อเวค"};
const KIND_LABEL = {hero: "ฮีโร่", pet: "สัตว์เลี้ยง", ring: "แหวน", set: "เซ็ตไอเทม"};
// Rings and item sets: slots per hero (must match MAX_RINGS / MAX_SETS on the server)
const GEAR_MAX = {ring: 2, set: 2};
const STATS = [ // [key, label, unit]
  ["atk","พลังโจมตี",""],["def","ป้องกัน",""],["hp","HP",""],["spd","สปีด",""],
  ["crit","อัตราคริ","%"],["critDmg","ดาเมจคริ","%"],["weak","โอกาสโดนจุดอ่อน","%"],["block","อัตราบล็อก","%"],
  ["hit","เข้าเป้า","%"],["res","ต้านทาน","%"],["dtr","ลดดาเมจที่ได้รับ","%"],["amp","เสริมความเสียหาย","%"],
  ["crush","บดขยี้","%"],["resil","ยืดหยุ่น","%"],["rejuv","ฟื้นฟู","%"]
];

const state = {tab:"war", q:"", type:"ทั้งหมด", teams:null, bosses:null, chars:new Map(), canWrite:false, password:null};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const splitList = s => s.split(/[,，]/).map(x => x.trim()).filter(Boolean);
const placed = l => [...l.back, ...l.front].filter(Boolean);
const teamById = id => { const t = state.teams.find(x => x.id === id); if(!t) throw new Error("ไม่พบทีม " + id); return t; };
const char = id => { const c = state.chars.get(id); if(!c) throw new Error("ไม่พบตัวละคร " + id); return c; };
const charsOf = kind => [...state.chars.values()].filter(c => c.kind === kind);
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2200); }

// ---------- tiles and boards
function faceHTML(c){
  const cls = c.kind === "hero" ? "ty-" + c.type : "ty-" + c.kind;
  return `<div class="face ${cls}">${esc([...c.name][0])}${c.img ? `<img src="${esc(c.img)}" alt="" loading="lazy">` : ""}</div>`;
}
// opts: {small, gear: "ring"|"set", badge, button:{attrs, pressed}}
function tileHTML(id, opts = {}){
  const inner = id
    ? `${faceHTML(char(id))}${opts.badge ? `<span class="spd" title="ลำดับ speed">${opts.badge}</span>` : ""}<span class="nm">${esc(char(id).name)}</span>`
    : `<div class="slot">${opts.button ? "+" : ""}</div>`;
  const cls = `tile${opts.small ? " small" : ""}${opts.gear ? " " + opts.gear : ""}`;
  return opts.button
    ? `<button type="button" class="${cls}" ${opts.button.attrs} aria-pressed="${!!opts.button.pressed}">${inner}</button>`
    : `<div class="${cls}">${inner}</div>`;
}
// Upper/lower skill boxes beside a hero. The number is the reservation order (position in l.skills + 1).
function skillBoxesHTML(l, id, edit){
  if(!id) return `<div class="skb blank"><span class="sk"></span><span class="sk"></span></div>`;
  const box = s => {
    const n = l.skills.findIndex(k => k.hero === id && k.s === s) + 1;
    const label = `${s === "top" ? "สกิลบน" : "สกิลล่าง"} ${char(id).name}${n ? ` ลำดับ ${n}` : ""}`;
    return edit
      ? `<button type="button" class="sk${n ? " on" : ""}" data-skill="${esc(id)}|${s}" aria-label="${esc(label)}" aria-pressed="${!!n}">${n || ""}</button>`
      : `<span class="sk${n ? " on" : ""}" title="${esc(label)}">${n || ""}</span>`;
  };
  return `<div class="skb">${box("top")}${box("bottom")}</div>`;
}
// l: lineup {formation, back, front, pet, subPet?, skills?}. edit: {active} makes slots clickable.
// skills: show skill boxes (counter teams only).
// badges: {heroId: speed order} shown on the tiles (boss teams).
function boardHTML(l, {ally = false, edit = null, withSubPet = false, skills = false, badges = {}} = {}){
  const slot = (id, key, small) => tileHTML(id, {
    small, badge: id ? badges[id] : null, button: edit ? {attrs: `data-slot="${key}" aria-label="ช่อง ${slotLabel(key)}"`, pressed: edit.active === key} : null,
  });
  const hero = (id, key) => skills ? `<div class="unit">${slot(id, key)}${skillBoxesHTML(l, id, edit)}</div>` : slot(id, key);
  const row = (ids, r) => `<div class="row ${r}">${ids.map((id, i) => hero(id, `${r === "B" ? "back" : "front"}:${i}`)).join("")}<span class="pos">${r}</span></div>`;
  const showSub = withSubPet && (edit || l.subPet);
  return `<div class="board${ally ? " ally" : ""}${skills ? " skills" : ""}"><div class="rows" style="--n:${Math.max(l.back.length, l.front.length)}">${row(l.back, "B")}${row(l.front, "F")}</div>
    <div class="petcol">${slot(l.pet || null, "pet")}${showSub ? slot(l.subPet || null, "subPet", true) : ""}</div></div>`;
}

// ---------- list
function matches(t){
  if(state.type !== "ทั้งหมด" && t.type !== state.type) return false;
  const q = state.q.trim();
  return !q || [...placed(t), ...t.counters.flatMap(placed)].some(id => char(id).name.includes(q));
}
function renderFilters(){
  $("#filters").innerHTML = `<span class="lbl">ประเภททีม</span>` + ["ทั้งหมด", ...TEAM_TYPES].map(ty =>
    `<button class="chip${ty === "ทั้งหมด" ? "" : " t-" + ty}" data-type="${ty}" aria-pressed="${state.type === ty}">${ty}</button>`).join("")
    + `<span class="count">ทั้งหมด ${state.teams ? state.teams.filter(matches).length : 0} รายการ</span>`;
}
function render(){ renderWar(); renderBosses(); }
function renderWar(){
  renderFilters();
  if(state.teams === null) return;
  const grid = $("#grid");
  if(!state.teams.length){
    const hint = !state.canWrite ? "" : charsOf("hero").length && charsOf("pet").length
      ? "<br>กด “+ เพิ่มทีม” ด้านบนเพื่อเพิ่มทีมแรก"
      : "<br>เริ่มจากกด “คลังตัวละคร” เพิ่มฮีโร่และสัตว์เลี้ยงก่อน แล้วค่อยเพิ่มทีม";
    grid.innerHTML = `<p class="empty">ยังไม่มีทีม${hint}</p>`;
    return;
  }
  const list = state.teams.filter(matches);
  grid.innerHTML = list.length ? list.map(t => `
    <article class="card">
      <div class="card-top"><span class="tag">ทีมเป้าหมาย · ${esc(t.type)}</span><span class="n">${t.counters.length} ทีมแก้</span></div>
      ${boardHTML(t)}
      <div class="card-foot"><span class="note">${esc(t.formation)}</span><button class="more" data-open-target="${esc(t.id)}">ดูเพิ่ม ›</button></div>
    </article>`).join("") : `<p class="empty">ไม่พบทีมที่ตรงกับ “${esc(state.q)}”</p>`;
}

// ---------- view: target team + counters
function openTarget(id){
  const t = teamById(id);
  showPanel(`<div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="ph">
    <div class="panel-head"><h2 id="ph">ทีมเป้าหมาย · ${esc(t.type)} · ${esc(t.formation)}</h2><button class="x" data-close aria-label="ปิด">✕</button></div>
    ${boardHTML(t)}
    ${state.canWrite ? `<div class="actions"><button class="btn" data-edit-target="${esc(t.id)}">แก้ไขทีมเป้าหมาย</button></div>` : ""}
    <div class="sec"><h3>ทีมที่ใช้ต่อสู้ได้ <small>${t.counters.length} ทีม</small></h3>
      ${state.canWrite ? `<button class="btn primary" data-add-counter="${esc(t.id)}">+ เพิ่มทีมสู้</button>` : ""}</div>
    ${t.counters.length ? `<div class="grid">${t.counters.map((c, i) => `
      <article class="card">
        <div class="card-top"><span class="tag form">${esc(c.formation)}</span></div>
        ${boardHTML(c, {ally: true, withSubPet: true, skills: true})}
        <div class="card-foot">${c.note ? `<span class="note">${esc(c.note)}</span>` : ""}<button class="more" data-open-counter="${esc(t.id)}" data-i="${i}">ดูรายละเอียด ›</button></div>
      </article>`).join("")}</div>`
    : `<p class="empty">ยังไม่มีทีมสู้${state.canWrite ? " กด “+ เพิ่มทีมสู้” เพื่อเพิ่ม" : ""}</p>`}
  </div>`);
}

// ---------- view: counter detail
function statsHTML(stats){
  const filled = STATS.filter(([k]) => stats[k] !== undefined);
  return filled.length ? `<div><div class="glabel">สเตตัส</div><div class="stats">${filled.map(([k, label, unit]) =>
    `<div class="stat"><span>${label}</span><b>${stats[k].toLocaleString("th-TH")}${unit}</b></div>`).join("")}</div></div>` : "";
}
// Rings or item sets as icons joined by "+".
function gearHTML(ids, kind){
  if(!ids.length) return `<span class="dash">—</span>`;
  return `<div class="rings">${ids.map(r => tileHTML(r, {gear: kind})).join(`<span class="plus">+</span>`)}</div>`;
}
function heroCardHTML(id, d){
  const c = char(id);
  return `<div class="hcard">
    <div class="who">${tileHTML(id)}<span class="tyl ty-${c.type}">${c.type}</span></div>
    <div class="hbody">
      <div class="gear">
        <div><div class="glabel">แหวน</div>${gearHTML(d.rings, "ring")}</div>
        <div><div class="glabel">เซ็ตไอเทม</div>${gearHTML(d.sets, "set")}</div>
      </div>
      ${statsHTML(d.stats)}
      ${d.detail ? `<p class="hdetail">${esc(d.detail)}</p>` : ""}
    </div>
  </div>`;
}
function openCounter(id, i){
  const t = teamById(id), c = t.counters[i];
  const withDetail = placed(c).filter(h => c.heroes[h]);
  showPanel(`<div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="ph">
    <div class="panel-head"><button class="backbtn" data-open-target="${esc(id)}">‹ กลับ</button><h2 id="ph">รายละเอียดทีมสู้ · ${esc(c.formation)}</h2><button class="x" data-close aria-label="ปิด">✕</button></div>
    <p class="hint">สู้กับ ${esc(placed(t).map(h => char(h).name).join(" · "))}</p>
    ${boardHTML(c, {ally: true, withSubPet: true, skills: true})}
    ${c.note ? `<div class="advice"><b>คำแนะนำ / วิธีเล่น</b><p>${esc(c.note)}</p></div>` : ""}
    <div class="sec"><h3>ตัวละคร</h3></div>
    ${withDetail.length ? `<div class="hcards">${withDetail.map(h => heroCardHTML(h, c.heroes[h])).join("")}</div>`
      : `<p class="empty">ยังไม่มีรายละเอียดตัวละคร${state.canWrite ? " กด “แก้ไขทีมสู้” เพื่อเพิ่ม" : ""}</p>`}
    ${state.canWrite ? `<p class="err" id="formErr" hidden></p><div class="actions">
      <button class="btn danger" data-del-counter="${esc(id)}" data-i="${i}">ลบทีมสู้</button>
      <button class="btn primary" data-edit-counter="${esc(id)}" data-i="${i}">แก้ไขทีมสู้</button></div>` : ""}
  </div>`);
}

// ---------- lineup editing (shared by target and counter editors)
// state.draft: {formation, back, front, pet, subPet?}; state.active: slot key being filled ("back:1", "pet", "subPet") or null
function emptyLineup(formation = "หน้า 3 หลัง 2"){
  const s = FORMATIONS[formation];
  return {formation, back: Array(s.B).fill(null), front: Array(s.F).fill(null), pet: ""};
}
// Keep heroes in their row and position where the new formation allows; move the rest into free slots.
function reflow(d, formation){
  const s = FORMATIONS[formation];
  const next = {back: Array(s.B).fill(null), front: Array(s.F).fill(null)}, spill = [];
  for(const r of ["back", "front"]) d[r].forEach((id, i) => { if(!id) return; if(i < next[r].length) next[r][i] = id; else spill.push([r, id]); });
  for(const [r, id] of spill){
    const order = r === "back" ? ["back", "front"] : ["front", "back"];
    const target = order.find(o => next[o].includes(null));
    next[target][next[target].indexOf(null)] = id;
  }
  return {...d, formation, ...next};
}
const slotGet = (d, key) => key.includes(":") ? d[key.split(":")[0]][+key.split(":")[1]] : d[key];
function slotSet(d, key, id){ if(key.includes(":")){ const [r, i] = key.split(":"); d[r][+i] = id; } else d[key] = id; }
function slotLabel(key){
  if(key === "pet") return "สัตว์เลี้ยง";
  if(key === "subPet") return "สัตว์เลี้ยงรอง";
  const [r, i] = key.split(":"); return `${r === "back" ? "แถวหลัง" : "แถวหน้า"} ช่อง ${+i + 1}`;
}
// opts: {ally, subPet, skills, max}
function lineupEditorHTML(o){
  return `<div class="fset">
    <div class="field"><span>ฟอร์เมชัน</span><div class="seg" id="formSeg"></div></div>
    <div id="board"></div>
    <p class="hint">กดช่องเพื่อเลือกตัวละคร ใส่ฮีโร่ได้ ${o.max} ตัว + สัตว์เลี้ยง 1 ตัว${o.subPet ? " (สัตว์เลี้ยงรองไม่บังคับ)" : ""}${o.skills ? ` · กดกล่องข้างตัวละครเพื่อจองสกิลบน/ล่างตามลำดับ ได้ ${MAX_SKILLS} สกิล` : ""}</p>
    <p class="err" id="skillErr" hidden></p>
    <div id="picker" hidden></div>
  </div>`;
}
function renderLineup(){
  const d = state.draft;
  if(d.skills) d.skills = d.skills.filter(k => placed(d).includes(k.hero));
  $("#formSeg").innerHTML = Object.keys(FORMATIONS).map(f => `<button type="button" data-formation="${f}" aria-pressed="${f === d.formation}">${f}</button>`).join("");
  const o = state.lineupOpts;
  $("#board").innerHTML = boardHTML(d, {ally: o.ally, edit: {active: state.active}, withSubPet: o.subPet, skills: o.skills});
  renderPicker();
  if(state.onLineupChange) state.onLineupChange();
}
const activeKind = () => state.active === "pet" || state.active === "subPet" ? "pet" : "hero";
function renderPicker(){
  const box = $("#picker"), key = state.active;
  box.hidden = !key;
  if(!key) return;
  const kind = activeKind();
  box.innerHTML = `<div class="picker-head"><b>เลือก${kind === "hero" ? "ฮีโร่" : "สัตว์เลี้ยง"} · ${slotLabel(key)}</b>
      <input id="pickQ" type="search" placeholder="ค้นหาชื่อ" value="${esc(state.pickQ)}" aria-label="ค้นหาชื่อ">
      ${slotGet(state.draft, key) ? `<button type="button" class="btn" data-pick="">เอาออกจากช่อง</button>` : ""}
      <button type="button" class="btn" data-pick-close>ปิด</button></div>
    <p class="err" id="pickErr" hidden></p>
    <div id="pickGrid"></div>`;
  renderPickGrid();
}
// Only the results redraw while typing in the search box.
function renderPickGrid(){
  const kind = activeKind(), q = state.pickQ.trim(), d = state.draft, current = slotGet(d, state.active);
  const inTeam = kind === "hero" ? placed(d) : [d.pet, d.subPet].filter(Boolean);
  const list = charsOf(kind).filter(c => !q || c.name.includes(q));
  $("#pickGrid").innerHTML = list.length
    ? `<div class="pick-grid">${list.map(c => tileHTML(c.id, {button: {attrs: `data-pick="${esc(c.id)}" data-placed="${inTeam.includes(c.id)}"`, pressed: c.id === current}})).join("")}</div>`
    : `<p class="hint">${charsOf(kind).length ? "ไม่พบชื่อที่ค้นหา" : `ยังไม่มี${kind === "hero" ? "ฮีโร่" : "สัตว์เลี้ยง"}ในคลัง เพิ่มได้ที่ “คลังตัวละคร”`}</p>`;
}
function pick(id){
  const d = state.draft, key = state.active, current = slotGet(d, key);
  if(id && key.includes(":")){
    const from = [...d.back.map((h, i) => [`back:${i}`, h]), ...d.front.map((h, i) => [`front:${i}`, h])].find(([, h]) => h === id)?.[0];
    if(from) slotSet(d, from, current);            // already placed: swap with this slot
    else if(!current && placed(d).length >= state.lineupOpts.max){
      const e = $("#pickErr"); e.textContent = `ครบ ${state.lineupOpts.max} ตัวแล้ว เอาตัวอื่นออกก่อน หรือกดช่องที่มีตัวละครเพื่อเปลี่ยน`; e.hidden = false; return;
    }
  }
  if(id && (key === "pet" || key === "subPet") && id === d[key === "pet" ? "subPet" : "pet"]){
    const e = $("#pickErr"); e.textContent = "สัตว์เลี้ยงหลักกับรองต้องไม่ซ้ำกัน"; e.hidden = false; return;
  }
  slotSet(d, key, id || (key.includes(":") ? null : ""));
  state.active = null;
  renderLineup();
}
// Tap an empty box to reserve the next number; tap a numbered box to free it (later numbers move up).
function toggleSkill(hero, s){
  const list = state.draft.skills, i = list.findIndex(k => k.hero === hero && k.s === s);
  const err = $("#skillErr");
  if(i >= 0) list.splice(i, 1);
  else if(list.length >= MAX_SKILLS){ err.textContent = `จองครบ ${MAX_SKILLS} สกิลแล้ว กดเลขเดิมเพื่อเอาออกก่อน`; err.hidden = false; return; }
  else list.push({hero, s});
  err.hidden = true;
  renderLineup();
}
function lineupFromDraft(){
  const d = state.draft;
  if(!placed(d).length) throw new Error("ใส่ฮีโร่อย่างน้อย 1 ตัว");
  if(!d.pet) throw new Error("เลือกสัตว์เลี้ยงด้วย");
  return {formation: d.formation, back: [...d.back], front: [...d.front], pet: d.pet};
}
const WAR_TARGET = {ally: false, subPet: false, skills: false, max: MAX_HEROES};
const WAR_COUNTER = {ally: true, subPet: true, skills: true, max: MAX_HEROES};
const BOSS_TEAM = {ally: true, subPet: false, skills: false, max: BOSS_MAX_HEROES};
function startLineup(l, opts){
  state.draft = {...l, back: [...l.back], front: [...l.front], ...(l.skills ? {skills: l.skills.map(k => ({...k}))} : {})};
  state.lineupOpts = opts; state.active = null; state.pickQ = ""; state.onLineupChange = null;
}

// ---------- editor: target team
function openTargetEditor(id){
  const t = id ? teamById(id) : null;
  startLineup(t || emptyLineup(), WAR_TARGET);
  showPanel(`<form class="panel wide" id="targetForm" data-id="${id ? esc(id) : ""}" role="dialog" aria-modal="true" aria-labelledby="ph">
    <div class="panel-head">${id ? `<button type="button" class="backbtn" data-open-target="${esc(id)}">‹ กลับ</button>` : ""}<h2 id="ph">${id ? "แก้ไขทีมเป้าหมาย" : "เพิ่มทีมเป้าหมาย"}</h2><button type="button" class="x" data-close aria-label="ปิด">✕</button></div>
    <label class="field"><span>ประเภททีม</span><select id="e-type">${TEAM_TYPES.map(ty => `<option${ty === t?.type ? " selected" : ""}>${ty}</option>`).join("")}</select></label>
    ${lineupEditorHTML(WAR_TARGET)}
    <p class="err" id="formErr" hidden></p>
    <div class="actions">
      ${id ? `<button type="button" class="btn danger" id="delTarget">ลบทีมนี้ทั้งหมด</button>` : ""}
      <button type="submit" class="btn primary" id="save">บันทึก</button>
    </div>
  </form>`);
  renderLineup();
}
async function saveTarget(form){
  const id = form.dataset.id;
  const team = {...(id ? teamById(id) : {counters: []}), type: $("#e-type").value, ...lineupFromDraft()};
  const saved = await api(id ? "PUT" : "POST", id ? teamUrl(id) : "/api/teams", strip(team));
  await loadAll(); toast("บันทึกแล้ว"); openTarget(id || saved.id);

// ---------- editor: counter team (+ per-hero details)

// Shrink to fit 240×240 and re-encode, so stored images stay small (~10–30 KB).
async function encodeImage(file){
  const bmp = await createImageBitmap(file);
  const scale = Math.min(1, 240 / Math.max(bmp.width, bmp.height));
  const canvas = Object.assign(document.createElement("canvas"), {width: Math.round(bmp.width * scale), height: Math.round(bmp.height * scale)});
  canvas.getContext("2d").drawImage(bmp, 0, 0, canvas.width, canvas.height);
  const blob = await new Promise(r => canvas.toBlob(r, "image/webp", 0.85));
  if(blob.size > 300 * 1024) throw new Error("รูปยังใหญ่เกิน 300 KB หลังย่อแล้ว ลองใช้รูปอื่น");
  const dataUrl = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
  return {type: blob.type, data: dataUrl.split(",")[1], preview: dataUrl};
}

      <div class="sgrid">${STATS.map(([key, label, unit]) =>
        `<label class="field"><span>${label}${unit ? " (" + unit + ")" : ""}</span><input data-s="${key}" type="number" min="0" step="any" value="${d.stats[key] ?? ""}"></label>`).join("")}</div>
      <label class="field"><span>รายละเอียด</span><textarea data-f="detail" maxlength="1000" placeholder="เช่น โจมน้อยกว่าตุ้ม ใส่แหวนบอส">${esc(d.detail)}</textarea></label>
    </div>
  </details>`;
}
const blankBossHero = () => ({speed: null, rings: [], love: "", sets: [], stats: {}, detail: ""});
function readBossHero(el){
  const f = k => el.querySelector(`[data-f="${k}"]`).value;
  const stats = {};
  for(const input of el.querySelectorAll("[data-s]")) if(input.value !== "") stats[input.dataset.s] = Number(input.value);
  return [el.dataset.hero, {speed: f("speed") ? Number(f("speed")) : null, rings: gearIds(el, "ring"), love: f("love").trim(), sets: gearIds(el, "set"), stats, detail: f("detail").trim()}];
}
function renderLoopEditor(){
  const d = state.draft, ids = placed(d);
  d.loop = d.loop.filter(k => ids.includes(k.hero));
  $("#loopPalette").innerHTML = ids.length
    ? ids.map(id => `<div class="lp">${SKILL_SLOTS.map(sl => skillIconHTML(id, sl, `data-loop-add="${esc(id)}|${sl}"`)).join("")}<span class="nm">${esc(char(id).name)}</span></div>`).join("")
    : `<p class="hint">วางฮีโร่ลงช่องก่อน สกิลของทีมจะขึ้นที่นี่</p>`;
  $("#loopStrip").innerHTML = d.loop.length
    ? d.loop.map((k, i) => skillIconHTML(k.hero, k.s, `data-loop-del="${i}"`, i + 1)).join("")
    : `<p class="hint">กดสกิลด้านบนเพื่อเพิ่มต่อท้ายลูป</p>`;
  $("#loopCount").textContent = `${d.loop.length}/${MAX_LOOP}`;
}
function loopAdd(hero, sl){
  const err = $("#loopErr");
  if(state.draft.loop.length >= MAX_LOOP){ err.textContent = `ลูปยาวได้ไม่เกิน ${MAX_LOOP} ครั้ง`; err.hidden = false; return; }
  err.hidden = true;
  state.draft.loop.push({hero, s: sl});
  renderLoopEditor();
}
function openRoomEditor(id, r){
  const b = bossById(id), t = b.rooms[r] || {...emptyLineup(), heroes: {}, loop: [], note: ""};
  startLineup(t, BOSS_TEAM);
  state.draft.loop = t.loop.map(k => ({...k}));
  state.heroSection = {html: bossHeroFieldsHTML, blank: blankBossHero, read: readBossHero};
  state.editHeroes = t.heroes; state.heroNodes = new Map();
  showPanel(`<form class="panel wide" id="roomForm" data-id="${esc(id)}" data-i="${r}" role="dialog" aria-modal="true" aria-labelledby="ph">
    <div class="panel-head"><button type="button" class="backbtn" data-open-boss="${esc(id)}">‹ กลับ</button><h2 id="ph">${esc(b.name)} · ${ROOM_LABEL[r]}</h2><button type="button" class="x" data-close aria-label="ปิด">✕</button></div>
    ${lineupEditorHTML(BOSS_TEAM)}
    <div class="sec"><h3>รายละเอียดตัวละคร <small>เว้นว่างช่องที่ไม่รู้ได้</small></h3></div>
    <div id="heroFields" class="hcards"></div>
    <div class="sec"><h3>ลูปสกิล <small id="loopCount"></small></h3><button type="button" class="btn" data-loop-clear>ล้างลูป</button></div>
    <div class="fset">
      <div><div class="glabel">กดสกิลเพื่อเพิ่มต่อท้ายลูป</div><div id="loopPalette" class="lpal"></div></div>
      <div><div class="glabel">ลูป (กดสกิลในลูปเพื่อเอาออก)</div><div id="loopStrip" class="loop"></div></div>
      <p class="err" id="loopErr" hidden></p>
    </div>
    <label class="field"><span>คำแนะนำทีม</span><textarea id="r-note" maxlength="500">${esc(t.note)}</textarea></label>
    <p class="err" id="formErr" hidden></p>
    <div class="actions">
      ${b.rooms[r] ? `<button type="button" class="btn danger" id="clearRoom">ล้างทีมห้องนี้</button>` : ""}
      <button type="submit" class="btn primary" id="save">บันทึกทีม</button>
    </div>
  </form>`);
  state.onLineupChange = () => { syncHeroFields(); renderLoopEditor(); };
  renderLineup();
}
async function saveRoom(form){
  const b = bossById(form.dataset.id), r = Number(form.dataset.i);
  const heroes = readHeroes();
  const speeds = Object.values(heroes).map(h => h.speed).filter(n => n !== null);
  if(new Set(speeds).size !== speeds.length) throw new Error("ลำดับ speed ซ้ำกัน แต่ละตัวต้องได้เลขไม่ซ้ำ");
  if(speeds.some(n => n > placed(state.draft).length)) throw new Error(`ทีมนี้มี ${placed(state.draft).length} ตัว ลำดับ speed ใช้ได้ถึง ${placed(state.draft).length}`);
  const team = {...lineupFromDraft(), heroes, loop: state.draft.loop, note: $("#r-note").value.trim()};
  const rooms = [...b.rooms]; rooms[r] = team;
  await api("PUT", bossUrl(b.id), {...stripBoss(b), rooms});
  await loadAll(); toast("บันทึกทีมแล้ว"); openBoss(b.id);
}

// ---------- deletes (two-tap confirm, no browser dialogs)
function confirmTap(btn, label){
  if(btn.dataset.confirm === "1") return true;
  btn.dataset.confirm = "1"; btn.textContent = label; return false;
}
async function deleteCounter(id, i, btn){
  if(!confirmTap(btn, "กดอีกครั้งเพื่อยืนยันการลบ")) return;
  const t = teamById(id);
  await api("PUT", teamUrl(id), strip({...t, counters: t.counters.filter((_, k) => k !== i)}));
  await loadAll(); toast("ลบทีมสู้แล้ว"); openTarget(id);
}
async function deleteTarget(id, btn){
  if(!confirmTap(btn, "กดอีกครั้ง: ลบทีมนี้และทีมสู้ทั้งหมด")) return;
  await api("DELETE", teamUrl(id));
  await loadAll(); closeSheet(); toast("ลบทีมแล้ว");
}
async function deleteBoss(id, btn){
  const label = MODE_LABEL[bossById(id).mode];
  if(!confirmTap(btn, `กดอีกครั้ง: ลบ${label}และทีมทั้งหมด`)) return;
  await api("DELETE", bossUrl(id));
  await loadAll(); closeSheet(); toast(`ลบ${label}แล้ว`);
}
async function clearRoom(id, r, btn){
  if(!confirmTap(btn, "กดอีกครั้งเพื่อยืนยัน")) return;
  const b = bossById(id), rooms = [...b.rooms]; rooms[r] = null;
  await api("PUT", bossUrl(id), {...stripBoss(b), rooms});
  await loadAll(); toast("ล้างทีมแล้ว"); openBoss(id);
}
async function deleteChar(id, btn){
  if(!confirmTap(btn, "กดอีกครั้งเพื่อยืนยันการลบ")) return;
  const kind = char(id).kind;
  await api("DELETE", "/api/characters/" + encodeURIComponent(id));
  await loadAll(); toast("ลบแล้ว"); openLibrary(kind);
}

// ---------- api
const teamUrl = id => "/api/teams/" + encodeURIComponent(id);
const strip = ({id, createdAt, updatedAt, ...team}) => team;
async function api(method, path, body){
  const headers = {"content-type":"application/json"};
  if(state.password) headers.authorization = "Bearer " + state.password;
  const res = await fetch(path, {method, headers, body: body === undefined ? undefined : JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  if(res.status === 401) setAdmin(null);
  if(!res.ok) throw new Error(data.error || `เซิร์ฟเวอร์ตอบกลับผิดพลาด (${res.status}) ลองใหม่อีกครั้ง`);
  return data;
}
async function loadAll(){
  try {
    const [chars, teams, bosses] = await Promise.all([api("GET", "/api/characters"), api("GET", "/api/teams"), api("GET", "/api/bosses")]);
    state.chars = new Map(chars.map(c => [c.id, c]));
    state.teams = teams; state.bosses = bosses;
    render();
  } catch(e){
    for(const g of ["#grid", "#bossGrid"]) $(g).innerHTML = `<p class="empty">โหลดข้อมูลไม่สำเร็จ: ${esc(e.message)}</p>`;
  }
}

// ---------- tabs
// war | boss | castle; #boss or #castle in the address opens that tab
function setTab(tab){
  state.tab = tab;
  $("#warView").hidden = tab !== "war"; $("#bossView").hidden = tab === "war";
  for(const b of document.querySelectorAll("[data-tab]")) b.setAttribute("aria-pressed", b.dataset.tab === tab);
  $("#add").textContent = tab === "war" ? "+ เพิ่มทีม" : `+ เพิ่ม${MODE_LABEL[tab]}`;
  history.replaceState(null, "", tab === "war" ? location.pathname : "#" + tab);
  renderBosses();
}

// ---------- admin
const PW_KEY = "47lovepiya-admin";
function setAdmin(pw){
  state.password = pw; state.canWrite = !!pw;
  $("#add").hidden = !pw; $("#library").hidden = !pw;
  $("#login").textContent = pw ? "ออกจากระบบ" : "แอดมิน";
  try { pw ? sessionStorage.setItem(PW_KEY, pw) : sessionStorage.removeItem(PW_KEY); } catch {}
  render();
}
function openLogin(){
  showPanel(`<form class="panel" id="loginForm" role="dialog" aria-modal="true" aria-labelledby="ph" style="max-width:380px">
    <div class="panel-head"><h2 id="ph">เข้าสู่ระบบแอดมิน</h2><button type="button" class="x" data-close aria-label="ปิด">✕</button></div>
    <label class="field"><span>รหัสผ่าน</span><input id="pw" type="password" autocomplete="current-password" required></label>
    <p class="err" id="formErr" hidden></p>
    <div class="actions"><button type="submit" class="btn primary" id="save">เข้าสู่ระบบ</button></div>
  </form>`);
  $("#pw").focus();
}
async function login(){
  state.password = $("#pw").value;
  try { await api("POST", "/api/auth"); }
  catch(e){ state.password = null; throw e; }
  setAdmin(state.password); closeSheet(); toast("เข้าสู่ระบบแล้ว");
}

// ---------- sheet
function showPanel(html){
  const s = $("#sheet");
  s.innerHTML = html; s.hidden = false; s.scrollTop = 0;
  s.querySelector("[data-close]").focus();
}
function closeSheet(){ $("#sheet").hidden = true; $("#sheet").innerHTML = ""; }
function showError(e){ const el = $("#formErr"); if(!el) throw e; el.textContent = e.message; el.hidden = false; }
async function run(btn, fn){
  if(btn) btn.disabled = true;
  try { await fn(); }
  catch(e){ showError(e); if(btn && btn.isConnected) btn.disabled = false; }
}

// ---------- events
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#filters").addEventListener("click", e => { const b = e.target.closest("[data-type]"); if(b){ state.type = b.dataset.type; render(); } });
$("#grid").addEventListener("click", e => { const b = e.target.closest("[data-open-target]"); if(b) openTarget(b.dataset.openTarget); });
$("#bossGrid").addEventListener("click", e => { const b = e.target.closest("[data-open-boss]"); if(b) openBoss(b.dataset.openBoss); });
document.querySelector(".navtabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if(b) setTab(b.dataset.tab); });
$("#add").addEventListener("click", () => state.tab === "war" ? openTargetEditor(null) : openBossEditor(null));
$("#library").addEventListener("click", () => openLibrary("hero"));
$("#login").addEventListener("click", () => state.password ? setAdmin(null) : openLogin());
$("#sheet").addEventListener("click", e => {
  const t = e.target;
  if(t.id === "sheet" || t.closest("[data-close]")) return closeSheet();
  const b = t.closest("button");
  if(!b) return;
  const d = b.dataset, i = d.i === undefined ? null : Number(d.i);
  if(d.skill){ const [hero, s] = d.skill.split("|"); return toggleSkill(hero, s); }
  if(d.gearSlot){ const [kind, slot] = d.gearSlot.split(":"); return openGearPicker(b.closest("[data-hero]"), kind, Number(slot)); }
  if(d.gearPick !== undefined) return pickGear(b.closest("[data-hero]"), d.gearPick);
  if(d.slot){ state.active = state.active === d.slot ? null : d.slot; state.pickQ = ""; renderLineup(); if(state.active) $("#pickQ").focus(); return; }
  if(d.pick !== undefined) return pick(d.pick);
  if(d.pickClose !== undefined){ state.active = null; return renderLineup(); }
  if(d.formation){ state.draft = reflow(state.draft, d.formation); state.active = null; return renderLineup(); }
  if(d.openTarget) return openTarget(d.openTarget);
  if(d.openCounter) return openCounter(d.openCounter, i);
  if(d.editTarget) return openTargetEditor(d.editTarget);
  if(d.addCounter) return openCounterEditor(d.addCounter, null);
  if(d.editCounter) return openCounterEditor(d.editCounter, i);
  if(d.openBoss) return openBoss(d.openBoss);
  if(d.editBoss) return openBossEditor(d.editBoss);
  if(d.editRoom) return openRoomEditor(d.editRoom, i);
  if(d.openStats) return openStats(d.openStats, i);
  if(d.loopAdd){ const [hero, sl] = d.loopAdd.split("|"); return loopAdd(hero, sl); }
  if(d.loopDel !== undefined){ state.draft.loop.splice(Number(d.loopDel), 1); $("#loopErr").hidden = true; return renderLoopEditor(); }
  if(d.loopClear !== undefined){ state.draft.loop = []; return renderLoopEditor(); }
  if(d.libTab) return openLibrary(d.libTab);
  if(d.newChar) return openCharEditor(null, d.newChar);
  if(d.editChar) return openCharEditor(d.editChar);
  const armed = b.dataset.confirm === "1" ? b : null;
  if(d.delCounter) return run(armed, () => deleteCounter(d.delCounter, i, b));
  if(b.id === "delTarget") return run(armed, () => deleteTarget($("#targetForm").dataset.id, b));
  if(b.id === "delChar") return run(armed, () => deleteChar($("#charForm").dataset.id, b));
  if(b.id === "delBoss") return run(armed, () => deleteBoss($("#bossForm").dataset.id, b));
  if(b.id === "clearRoom") return run(armed, () => clearRoom($("#roomForm").dataset.id, Number($("#roomForm").dataset.i), b));
});
$("#sheet").addEventListener("input", e => {
  if(e.target.id === "pickQ"){ state.pickQ = e.target.value; renderPickGrid(); }
});
$("#sheet").addEventListener("change", e => {
  const el = e.target, file = el.files?.[0];
  if(!file) return;
  if(el.id === "charFile") return run(null, async () => {
    state.charImage = await encodeImage(file);
    const form = $("#charForm");
    $("#charPreview").innerHTML = previewHTML({kind: form.dataset.kind, name: $("#charName").value, type: form.dataset.kind === "hero" ? $("#charType").value : ""}, state.charImage.preview);
  });
  if(el.dataset.skillFile) return run(null, async () => {
    const sl = el.dataset.skillFile;
    state.skillImages[sl] = await encodeImage(file);
    $(`#skillPrev-${sl}`).innerHTML = skillPreviewHTML(state.skillImages[sl].preview);
  });
  if(el.id === "bossFile") return run(null, async () => {
    state.bossImage = await encodeImage(file);
    $("#bossPreview").innerHTML = bossFaceHTML({name: $("#bossName").value}, state.bossImage.preview);
  });
});
$("#sheet").addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target;
  const action = {loginForm: login, targetForm: () => saveTarget(f), counterForm: () => saveCounter(f), charForm: () => saveChar(f),
                  bossForm: () => saveBoss(f), roomForm: () => saveRoom(f)}[f.id];
  if(!action) throw new Error("ไม่รู้จักฟอร์ม " + f.id);
  run($("#save"), action);
});
$("#pop").addEventListener("click", e => { if(e.target.id === "pop" || e.target.closest("[data-close]")) closePop(); });
document.addEventListener("keydown", e => {
  if(e.key !== "Escape") return;
  if(!$("#pop").hidden) return closePop();
  if(!$("#sheet").hidden) closeSheet();
});

let savedPw = null;
try { savedPw = sessionStorage.getItem(PW_KEY); } catch {}
const tabFromHash = () => MODE_LABEL[location.hash.slice(1)] ? location.hash.slice(1) : "war";
window.addEventListener("hashchange", () => setTab(tabFromHash()));
setTab(tabFromHash());
setAdmin(savedPw);
loadAll();
</script>
</body>
</html>
